# ============================================================================
# CONFIGURACION PRINCIPAL DEL SERVICIO ECOAPI (CASO ECORECICLA)
# Conecta al contenedor Docker de Oracle (puerto 1522, servicio FREEPDB1)
# y configura la firma HMAC-SHA256 para los tokens JWT con vigencia de 1 hora.
# ============================================================================
server:
  port: 8080

spring:
  application:
    name: EcoAPI
  datasource:
    # Conexion al contenedor Docker oracle-pharma (Oracle Database Free 26ai)
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:ECORECICLA}
    password: ${SPRING_DATASOURCE_PASSWORD:1234567}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # El esquema se gestiona con Flyway (db/migration); Hibernate valida la estructura.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    pe.upeu.ecorecicla: DEBUG
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://10.0.2.2:8080
  jwt:
    # Clave secreta HMAC-SHA256 en Base64 (al menos 256 bits / 32 bytes).
    # Con esta clave JwtService firma el token en el login y JwtAuthenticationFilter lo verifica.
    secret: ILPEwcQMZU9TnjpXzv/hRWNoC9n1Imz+nPTBwMZH7TBX9n7f7XagfIgD7LhCEFZNclj1zxfx9FbVvbpfH45HOA==
    # Vigencia exacta de 1 hora (60 minutos = 3600 segundos) exigida por RF-B01 y seccion 4.1
    expiracion-minutos: 60
