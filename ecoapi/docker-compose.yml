version: '3.9'

# ============================================================================
# DOCKER COMPOSE - BASE DE DATOS ORACLE FREE 26ai PARA ECOAPI (ECORECICLA)
# Si ya tienes el contenedor `oracle-pharma` corriendo en el puerto 1522:
#   docker start oracle-pharma
# Si deseas levantarlo desde cero con Docker Compose:
#   docker compose up -d
# ============================================================================
services:
  oracle-ecorecicla:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-pharma
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PWD=1234567
      - ORACLE_CHARACTERSET=AL32UTF8
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s sys/1234567@//localhost:1521/FREEPDB1 as sysdba"]
      interval: 15s
      timeout: 10s
      retries: 10
